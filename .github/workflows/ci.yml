name: MeshPilot
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: meshpilot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (TypeScript)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: { persist-credentials: false }
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with: { node-version: "22.22.3", package-manager-cache: false }
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  desktop:
    name: Desktop (Rust + Tauri + нативное окно)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/desktop
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: { persist-credentials: false }
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with: { node-version: "22.22.3", package-manager-cache: false }
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Зависимости Tauri на одноразовом runner
        timeout-minutes: 6
        run: bash ../../.github/scripts/desktop-deps.sh
      # rustfmt на этой машине недоступен (нет тулчейна), поэтому гейт — предупреждение,
      # а не отказ. На машине с Rust: `cargo fmt --manifest-path src-tauri/Cargo.toml --check`.
      - name: rustfmt (информационно)
        continue-on-error: true
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      # Лог clippy сохраняем артефактом (раннерный бэкенд логов из sandbox недоступен),
      # затем строгая проверка — финальный шаг обязан завершиться нулём.
      - name: clippy (лог в артефакт)
        id: clippy
        run: |
          set +e
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings > clippy.log 2>&1
          code=$?
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          echo "clippy завершился с кодом $code (полный лог — в артефакте clippy-log)"
          tail -n 5 clippy.log || true
      - name: Артефакт лога clippy
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clippy-log
          path: apps/desktop/clippy.log
          retention-days: 7
      - name: clippy (строго)
        run: |
          tail -n 300 clippy.log
          test "${{ steps.clippy.outputs.exit }}" = "0"
      - name: cargo test (юнит-тесты парсеров и инвариантов)
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Сборка отладочного бинарника Tauri
        run: npm run tauri -- build --debug --no-bundle --ci
      - name: Нативное окно без root и без изменений хоста
        run: xvfb-run -a dbus-run-session -- bash ../../tests/native-window.sh src-tauri/target/debug/meshpilot-desktop
        env:
          GDK_BACKEND: x11
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
