[workspace]
members = ["crates/meshpilot-core", "crates/meshpilot-linux", "crates/meshpilot-cli"]
default-members = ["crates/meshpilot-cli"]
exclude = ["apps/desktop/src-tauri"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
repository = "https://github.com/Knox1986X/MeshPilot"
publish = false

[workspace.dependencies]
meshpilot-core = { path = "crates/meshpilot-core" }
meshpilot-linux = { path = "crates/meshpilot-linux" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[workspace.lints.rust]
unsafe_code = "forbid"
