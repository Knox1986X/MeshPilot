[package]
name = "meshpilot"
version = "0.2.0"
description = "MeshPilot — Джарвис и инструменты обслуживания CachyOS/Arch"
authors = ["Knox1986X"]
license = "MIT"
edition = "2021"
rust-version = "1.75"
publish = false

[lib]
name = "meshpilot_lib"
crate-type = ["rlib"]
path = "src/lib.rs"

[[bin]]
name = "meshpilot-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.6", features = [] }

[dependencies]
tauri = { version = "=2.12.7", features = ["custom-protocol"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
libc = "0.2"
glob = "0.3"
keyring = "3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
