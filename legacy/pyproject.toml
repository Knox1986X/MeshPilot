[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meshpilot"
version = "0.1.0"
description = "MeshPilot — голосовой ассистент (Jarvis / Хан / Аниме) + оптимизатор CachyOS: чистка, зеркала, DNS, Zapret2"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "MeshPilot"}]
keywords = ["voice-assistant", "cachyos", "arch", "zapret", "groq", "gigachat", "hermes", "optimizer"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: System :: Systems Administration",
]
# Ядро: лёгкие зависимости, работают на Python 3.11-3.14.
# Тяжёлые (STT/TTS/GUI) — в extras ниже, ставятся по желанию.
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "rich>=13.7",
    "typer>=0.12",
    "aiofiles>=24.1",
    "psutil>=5.9",
    "dnspython>=2.6",
    "cryptography>=42.0",
]

[project.optional-dependencies]
# Голос: STT/TTS/wakeword. openwakeword тянет tflite-runtime (нет колёс для 3.14) —
# поэтому это опционально. На 3.14 ставь без wakeword, остальное встанет.
voice = [
    "sounddevice>=0.4.6",
    "soundfile>=0.12",
    "numpy>=1.26",
    "faster-whisper>=1.0",
    "piper-tts>=1.2",
    "edge-tts>=6.1",
]
voice-wake = ["openwakeword>=0.6"]
gui = ["PySide6>=6.7", "PySide6-WebEngine>=6.7"]
full = [
    "sounddevice>=0.4.6",
    "soundfile>=0.12",
    "numpy>=1.26",
    "faster-whisper>=1.0",
    "piper-tts>=1.2",
    "edge-tts>=6.1",
    "PySide6>=6.7",
    "PySide6-WebEngine>=6.7",
    "torch>=2.3",
    "onnxruntime>=1.17",
    "transformers>=4.40",
    "librosa>=0.10",
]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4", "mypy>=1.10"]
zapret = []

[project.scripts]
meshpilot = "meshpilot.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
